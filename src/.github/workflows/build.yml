name: Build WinCleanerPro EXE

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --onefile --windowed --uac-admin --name WinCleanerPro --collect-all customtkinter --collect-all matplotlib src/wincleaner_pro.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinCleanerPro.exe
          path: dist/WinCleanerPro.exe
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinCleanerPro.exe
